    <script>
    let workbookData = null, currentSheetData = [], filteredSheetData = [], fullHeaders = [], clusterize = null, originalColumnData = {};
    const expectedColumns = ['SERVICE', 'FLOW', 'PARTNERID', 'PARTNER_NAME', 'PARTNER_TYPE'];
    const autoSelectValues = {
      PARTNER_NAME: ['AERIS_IOT', 'CINTEX', 'DISH_MVNO', 'EARTHLINK, LLC', 'NOVA', 'TWILIONB', 'ULTRA'],
      FLOW: ['ACTIVATE', 'DEACTIVATE','REACTIVATE','ACTIVATEWITHPORTIN','UPDATEMISCSUBSCRIBERDETAILS']
    };

    // Store active header filters
    let activeHeaderFilters = {}; // { 'COLUMN_NAME': ['value1', 'value2'], ... }
    let currentPopupColumn = null; // To keep track of which column's filter is open

    $(document).ready(function () {
      $('#sheetSelect').select2({ placeholder: "-- Select Sheet --" });
      $('#sheetSelect').on('change', function () { loadSheet(this.value); });
      
      // Close dropdowns and popups when clicking outside
      $(document).click(function(e) {
        if (!$(e.target).closest('.dropdown-section').length) {
          $('.checkbox-list').hide();
        }
        if (!$(e.target).closest('#columnFilterPopup').length && !$(e.target).hasClass('filter-icon')) {
          $('#columnFilterPopup').hide();
        }
      });

      // Popup button handlers
      $('#popupSelectAll').on('click', function() {
        $('#popupCheckboxList input[type="checkbox"]:visible').prop('checked', true);
      });
      $('#popupClearAll').on('click', function() {
        $('#popupCheckboxList input[type="checkbox"]:visible').prop('checked', false);
      });
      $('#popupSearchInput').on('keyup', debounce(function() {
        const searchTerm = $(this).val().toLowerCase();
        $('#popupCheckboxList div').each(function() {
          const label = $(this).find('label').text().toLowerCase();
          $(this).toggle(label.includes(searchTerm));
        });
      }, 200));
      $('#popupApply').on('click', function() {
        const selectedValues = $('#popupCheckboxList input[type="checkbox"]:checked').map(function() {
          return $(this).val();
        }).get();
        
        if (selectedValues.length > 0) {
          activeHeaderFilters[currentPopupColumn] = selectedValues.map(v => String(v).trim().toLowerCase());
          $(`.filter-icon[data-column="${currentPopupColumn}"]`).addClass('active');
        } else {
          delete activeHeaderFilters[currentPopupColumn];
          $(`.filter-icon[data-column="${currentPopupColumn}"]`).removeClass('active');
        }
        $('#columnFilterPopup').hide();
        applyTableColumnFilters();
      });
      $('#popupCancel').on('click', function() {
        $('#columnFilterPopup').hide();
      });
    });

    function debounce(func, delay) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), delay);
      };
    }

    document.getElementById('excelFile').addEventListener('change', function (e) {
  const file = e.target.files[0];
if (!file) return;

// ✅ Show spinner during Excel parsing
$('#loadingSpinner').show();


  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      workbookData = workbook;
      const sheets = workbook.SheetNames.filter(n => n.startsWith('New_AT_Regression'));

      if (sheets.length === 0) {
        const allSheets = workbook.SheetNames;
        $('#sheetSelect').html('<option value="">-- Select Sheet --</option>' + allSheets.map(s => `<option value="${s}">${s}</option>`).join('')).trigger('change.select2');
        alert("No sheets starting with 'New_AT_Regression' found. Showing all sheets.");
      } else {
        $('#sheetSelect').html('<option value="">-- Select Sheet --</option>' + sheets.map(s => `<option value="${s}">${s}</option>`).join('')).trigger('change.select2');
      }

    } catch (err) {
      alert("Error processing Excel file.");
      console.error(err);
    } finally {
      // Hide spinner
      $('#loadingSpinner').hide();
    }
  };

  reader.onerror = function () {
    alert("Failed to read the file.");
    $('#loadingSpinner').hide();
  };

  reader.readAsArrayBuffer(file);
});


   function loadSheet(name) {
  $('#formContainer').empty();
  $('#activeFilters').empty();
  $('#tableHead').empty();
  //if (clusterize) { clusterize.destroy(true); clusterize = null; }
  $('#recordCount').text('');
  if (!name) return;

  // 🔵 Show "Processing..." spinner
  $('#loadingSpinner').show();

  const sheet = workbookData.Sheets[name];
  const data = XLSX.utils.sheet_to_json(sheet, { defval: '' });

  if (data.length === 0) {
    $('#loadingSpinner').hide(); // 🔴 Hide on error
    alert("No data found in the selected sheet.");
    return;
  }

  currentSheetData = data;
  filteredSheetData = data;
  fullHeaders = Object.keys(data[0]);

  updateTableHeader(fullHeaders);

  const columnData = {};
  const availableExpectedColumns = expectedColumns.filter(col => fullHeaders.includes(col));

  if (availableExpectedColumns.length === 0) {
    alert("None of the expected columns (SERVICE, FLOW, PARTNERID, PARTNER_NAME, PARTNER_TYPE) were found in this sheet.");
    showTable(data);
    $('#loadingSpinner').hide(); // ✅ Hide after display
    return;
  }

  availableExpectedColumns.forEach(col => {
    const colValues = data.map(r => r[col]);
    const uniqueValues = [...new Set(colValues.map(v => {
      const val = String(v || '').trim();
      return val === '' ? null : val.toUpperCase();
    }).filter(v => v !== null))];
    
    columnData[col] = uniqueValues.sort();
  });

  originalColumnData = { ...columnData };
  generateForm(columnData);

  // Auto-select filters based on config
  setTimeout(() => {
    Object.entries(autoSelectValues).forEach(([column, values]) => {
      const available = values.filter(val =>
        $(`input[name='${column}'][value='${val}']`).length > 0
      );

      if (available.length > 0) {
        available.forEach(val => {
          $(`input[name='${column}'][value='${val}']`).prop('checked', true);
        });
        updateSelectedCount(column);
      }
    });

    updateCascadingFilters();
    applyTableColumnFilters(); // Call the consolidated filter function

    // ✅ Done loading: hide spinner
    $('#loadingSpinner').hide();
  }, 200);

  showTable(data); // Table will populate here initially
}

function updateTableHeader(headers) {
  // 1. Preserve existing checked columns
  const currentSelections = {};
  $('#columnSelectorList input[type="checkbox"]').each(function () {
    const col = $(this).data('col');
    currentSelections[col] = $(this).is(':checked');
  });

  // 2. Add TEST_RUN_ID and ENABLED handling
  const modifiedHeaders = ['TEST_RUN_ID', ...headers];
  if (modifiedHeaders.includes('MATCH_REQUEST') && !modifiedHeaders.includes('ENABLED')) {
    const idx = modifiedHeaders.indexOf('MATCH_REQUEST') + 1;
    modifiedHeaders.splice(idx, 0, 'ENABLED');
  }
  fullHeaders = modifiedHeaders;

  // 3. Build header row with filter icons
  const headerRow = '<tr>' + modifiedHeaders.map(h => {
    const className = h === 'MATCH_REQUEST' ? 'match-request-header' : '';
    const isActive = activeHeaderFilters[h] && activeHeaderFilters[h].length > 0 ? 'active' : '';
    return `<th class="${className}">
              ${h} <i class="fas fa-filter filter-icon ${isActive}" data-column="${h}"></i>
            </th>`;
  }).join('') + '</tr>';
  $('#tableHead').html(headerRow);

  // 4. Re-render checkboxes in the dropdown
  renderColumnSelector(fullHeaders);

  // 5. Restore checked/unchecked state from before
  for (const col in currentSelections) {
    const checkbox = $(`#col_${col}`);
    if (checkbox.length) {
      checkbox.prop('checked', currentSelections[col]).trigger('change');
    }
  }

// Function to open the column filter popup
function openColumnFilterPopup(columnName, $clickedIcon) {
  currentPopupColumn = columnName;
  $('#popupColumnName').text(`Filter ${columnName}`);
  $('#popupSearchInput').val(''); // Clear search input

  const uniqueValues = [...new Set(currentSheetData.map(row => 
    String(row[columnName] || '').trim()))].filter(v => v).sort();

  let checkboxesHtml = '';
  const currentSelected = activeHeaderFilters[columnName] || [];

  uniqueValues.forEach(val => {
    const isChecked = currentSelected.includes(String(val).trim().toLowerCase()) ? 'checked' : '';
    checkboxesHtml += `
      <div>
        <input type="checkbox" id="popup_filter_${columnName}_${val.replace(/\s/g, '_')}" value="${val}" ${isChecked} />
        <label for="popup_filter_${columnName}_${val.replace(/\s/g, '_')}">${val}</label>
      </div>
    `;
  });
  $('#popupCheckboxList').html(checkboxesHtml);

  // Position the popup
  const iconOffset = $clickedIcon.offset();
  const iconHeight = $clickedIcon.outerHeight();
  const popup = $('#columnFilterPopup');
  
  // Calculate position to avoid going off-screen
  let top = iconOffset.top + iconHeight + 5;
  let left = iconOffset.left;

  // Adjust if it goes off the right edge
  const viewportWidth = $(window).width();
  const popupWidth = popup.outerWidth();
  if (left + popupWidth > viewportWidth - 20) { // 20px margin from right edge
    left = viewportWidth - popupWidth - 20;
  }
  // Ensure it doesn't go off the left edge
  if (left < 10) {
    left = 10;
  }

  popup.css({
    top: top + 'px',
    left: left + 'px'
  }).show();
}


// Consolidated filtering function
function applyTableColumnFilters() {
  let tempFilteredData = [...currentSheetData]; // Always start with the full current sheet data

  // 1. Collect filters from dropdowns (main form)
  const dropdownFilters = {};
  expectedColumns.forEach(col => {
    const selected = $(`input[name='${col}']:checked`).map(function () {
      return String(this.value).trim().toUpperCase();
    }).get();
    if (selected.length > 0) {
      dropdownFilters[col] = selected;
    }
  });

  // 2. Collect filters from header icons (activeHeaderFilters object)
  // activeHeaderFilters is already populated by openColumnFilterPopup's Apply button
  
  // 3. Apply all collected filters
  tempFilteredData = tempFilteredData.filter(row => {
    let passesAllFilters = true;

    // Apply main dropdown filters
    for (const col in dropdownFilters) {
      const rowValue = String(row[col] || '').trim().toUpperCase();
      if (!dropdownFilters[col].includes(rowValue)) {
        passesAllFilters = false;
        break;
      }
    }

    if (!passesAllFilters) return false; // If it fails dropdown filters, no need to check header filters

    // Apply header icon filters
    for (const col in activeHeaderFilters) {
      const rowValue = String(row[col] || '').trim().toLowerCase();
      if (!activeHeaderFilters[col].includes(rowValue)) { // Check if row value is in selected header filter values
        passesAllFilters = false;
        break;
      }
    }

    return passesAllFilters;
  });

  filteredSheetData = tempFilteredData; // Update the global filtered data
  currentPage = 1; // Reset pagination

  // Update active filter tags display (from dropdowns)
  let tags = [];
  const activeColumns = [...new Set($('.filter-check').map(function () {
    return $(this).data('column');
  }).get())];

  activeColumns.forEach(col => {
    const selected = $(`input[name='${col}']:checked`).map(function () {
      return String(this.value).trim().toUpperCase();
    }).get();
    if (selected.length > 0) {
      tags.push(...selected.map(val => `<span class='filter-tag' data-col='${col}' data-val='${val}'>${col}: ${val} ×</span>`));
    }
  });
  $('#activeFilters').html(tags.length ? `<strong>Active Filters:</strong><br>${tags.join(' ')}` : '');
  $('#activeFilters .filter-tag').off('click').on('click', function () {
    const col = $(this).data('col');
    const val = $(this).data('val');
    $(`input[name='${col}'][value='${val}']`).prop('checked', false);
    updateSelectedCount(col);
    updateCascadingFilters();
    applyTableColumnFilters(); // Call the main filter function
  });


  // Replace expiryDateTime in MATCH_REQUEST and add ENABLED column
  const todayPlus30 = new Date();
  todayPlus30.setDate(todayPlus30.getDate() + 30);
  const isoDate = todayPlus30.toISOString().split('.')[0];

  filteredSheetData.forEach(row => { // Use filteredSheetData here
    if (row['MATCH_REQUEST'] && typeof row['MATCH_REQUEST'] === 'string') {
      row['MATCH_REQUEST'] = row['MATCH_REQUEST'].replace(
        /"expiryDateTime"\s*:\s*"[^"]*"/g,
        `"expiryDateTime": "${isoDate}"`
      );
    }

    // Add ENABLED column after MATCH_REQUEST
    if ('MATCH_REQUEST' in row) {
      const newRow = {};
      for (const [key, value] of Object.entries(row)) {
        newRow[key] = value;
        if (key === 'MATCH_REQUEST') {
          newRow['ENABLED'] = '';
        }
      }
      Object.assign(row, newRow);
    } else {
      row['ENABLED'] = '';
    }

    // Clean SERVICE field
    let originalService = row['SERVICE'];
    if (originalService) {
      const baseService = originalService.replace(/(_\d+)+$/, '');
      row['SERVICE'] = `${baseService}`;
    }
  });

  const sorted = customSortFlowAndPartner(filteredSheetData);
  showTable(sorted);
}

      rows_in_block: 100,
      blocks_in_cluster: 4,
      show_no_data_row: false,
      tag: 'tr',

          reordered[h] = 'No'; // ✅ Set ENABLED to "No"
        } else if (h !== 'TEST_RUN_ID') {
          reordered[h] = row[h];
        }
      });
      return reordered;
    });

    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, partner.substring(0, 31));
  });

  XLSX.writeFile(wb, `${fileNamePrefix}.xlsx`);
});

$('#exportTCButton').click(() => {
  const fileNamePrefix = $('#fileName').val().trim();
  if (!fileNamePrefix) {
    alert("Please enter a file name before downloading.");
    return;
  }

  const exportData = filteredSheetData.map(row => {
    const matchText = row['MATCH_REQUEST'];
    const flowName = row['FLOW']?.trim() || '';
    let sentence = '';

    try {
      const obj = typeof matchText === 'string' ? JSON.parse(matchText) : matchText;
      const jsonData = obj.JSON || {};
      const baseProductId = jsonData.baseProduct?.baseProductId || '';
      let rawProduct = jsonData.baseProduct?.product ?? jsonData.product;
      let productArray = [];

      if (rawProduct) {
        productArray = Array.isArray(rawProduct) ? rawProduct : [rawProduct];
      }

      const sloList = productArray.map(p => {
        const pid = p.ProductID || p.ProductId;
        const act = p.action;
        if (pid && act) return `${act}:${pid}`;
        if (pid) return pid;
        return '';
      }).filter(Boolean).join(', ');

      if (flowName && baseProductId && sloList) {
        sentence = `${flowName} subscriber with ${baseProductId} TLO and ${sloList} SLO's`;
      } else if (flowName && baseProductId) {
        sentence = `${flowName} subscriber with ${baseProductId} TLO`;
      } else if (flowName && sloList) {
        sentence = `${flowName} subscriber with ${sloList} SLO's`;
      } else if (flowName) {
        sentence = `${flowName} subscriber`;
      }
    } catch (e) {
      // Fall through
    }

    return { MATCH_REQUEST: sentence || matchText };
  });

  const ws = XLSX.utils.json_to_sheet(exportData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'TC Export');
  XLSX.writeFile(wb, `${fileNamePrefix}_TCs.xlsx`);
});



$(document).on('click', '#duplicateRowsBtn', function () {
  if (!currentSheetData.length) {
    alert("No data loaded.");
    return;
  }

  const groupedByPartner = {};

  currentSheetData.forEach(row => {
    const partner = row.PARTNERID;
    if (!groupedByPartner[partner]) {
      groupedByPartner[partner] = {
        ACTIVATE: [],
        //DEACTIVATE: [],
        REACTIVATE: []
      };
    }
    const flow = (row.FLOW || '').toUpperCase();
    if (groupedByPartner[partner][flow]) {
      groupedByPartner[partner][flow].push(row);
    }
  });

  let dupRows = [];

  Object.entries(groupedByPartner).forEach(([partner, flows]) => {
    const reactivateCount = flows.REACTIVATE.length;
    const activateCount = flows.ACTIVATE.length;
    //const deactivateCount = flows.DEACTIVATE.length;

    const targetActivate = Math.max(0, reactivateCount - activateCount + 5);
    //const targetDeactivate = Math.max(0, reactivateCount - deactivateCount + 5);

    const generateDup = (sourceArr, count, flowName) => {
      for (let i = 0; i < count; i++) {
        const original = sourceArr[i % sourceArr.length];
        const clone = structuredClone(original);
        clone['SERVICE'] = `Dup${original['SERVICE'] || flowName}_${i + 1}`;
        clone['IS_DUPLICATE'] = true;
        dupRows.push(clone);
      }
    };

    if (flows.ACTIVATE.length > 0 && targetActivate > 0) {
      generateDup(flows.ACTIVATE, targetActivate, 'Activate');
    }

    //if (flows.DEACTIVATE.length > 0 && targetDeactivate > 0) {
    //  generateDup(flows.DEACTIVATE, targetDeactivate, 'Deactivate');
    //}
  });

  currentSheetData = [...currentSheetData, ...dupRows];
  filteredSheetData = [...filteredSheetData, ...dupRows];
  applyTableColumnFilters(); // Call the consolidated filter function

  alert(`Added ${dupRows.length} duplicate rows (adjusted per partner to match REACTIVATE + 5).`);
});

function applyColumnVisibility() {
  $('#columnSelectorList input[type="checkbox"]').each(function () {

    const isVisible = $(this).is(':checked');

    const table = document.getElementById('dataTable');
    const rows = table.querySelectorAll('tr');

    rows.forEach(row => {
      const cells = row.children;
      if (cells[colIndex]) {
        cells[colIndex].style.display = isVisible ? '' : 'none';
      }
    });

    // Special class toggle for MATCH_REQUEST (if needed)
    if (col === 'MATCH_REQUEST') {
      const scrollArea = $('#scrollArea');
      if (isVisible) {
        scrollArea.removeClass('hide-match-request');
      } else {
        scrollArea.addClass('hide-match-request');
      }
    }
  });
}
function customSortFlowAndPartner(data) {
  const flowOrder = ['ACTIVATE', 'DEACTIVATE', 'REACTIVATE', 'UPDATEMISCSUBSCRIBERDETAILS'];

  return data.sort((a, b) => {
    // ✅ Move duplicates to bottom
    const isDupA = !!a.IS_DUPLICATE;
    const isDupB = !!b.IS_DUPLICATE;
    if (isDupA !== isDupB) return isDupA ? 1 : -1;

    // ✅ Group by PARTNERID first
    const partnerA = (a.PARTNERID || '').toString();
    const partnerB = (b.PARTNERID || '').toString();
    const partnerCompare = partnerA.localeCompare(partnerB, undefined, { numeric: true });
    if (partnerCompare !== 0) return partnerCompare;

    // ✅ Then by FLOW
    const flowA = (a.FLOW || '').toUpperCase();
    const flowB = (b.FLOW || '').toUpperCase();
    const flowIndexA = flowOrder.indexOf(flowA);
    const flowIndexB = flowOrder.indexOf(flowB);
    return flowIndexA - flowIndexB;
  });
}
$('#dashboardButton').click(function() {
  const data = filteredSheetData.length ? filteredSheetData : currentSheetData;
  if (!data.length) {
    alert("No data loaded.");
    return;
  }

  // Get ALL unique flows and partners from the data, trimming and uppercasing for consistency
  const flowTypes = [...new Set(data.map(row => (row.FLOW || '').toUpperCase().trim()))].filter(Boolean).sort();
  const partners = [...new Set(data.map(row => (row.PARTNER_NAME || '').toUpperCase().trim()))].filter(Boolean).sort();

  // Debug logs
  console.log("Detected flows:", flowTypes);
  console.log("Detected partners:", partners);

  // Prepare table data (flows as rows, partners as columns)
  const tableData = {};
  flowTypes.forEach(flow => {
    tableData[flow] = {};
    partners.forEach(partner => {
      tableData[flow][partner] = 0;
    });
  });

  data.forEach(row => {
    const partner = (row.PARTNER_NAME || '').toUpperCase().trim();
    const flow = (row.FLOW || '').toUpperCase().trim();
    if (partner && flow && tableData[flow] && tableData[flow][partner] !== undefined) {
      tableData[flow][partner]++;
    }
  });

  // Build table: flows as rows, partners as columns
  const tbody = $('#dashboardTable tbody');
  const thead = $('#dashboardTable thead');
  tbody.empty();
  thead.html(`
    <tr>
      <th style="border:1px solid #ccc; padding:6px;">FLOW</th>
      ${partners.map(p => `<th style="border:1px solid #ccc; padding:6px;">${p}</th>`).join('')}
      <th style="border:1px solid #ccc; padding:6px;">Total</th>
    </tr>
  `);

  const rowTotals = [];

  flowTypes.forEach(flow => {
    let rowTotal = 0;
    const cells = partners.map((partner, i) => {
      const val = tableData[flow][partner];
      rowTotal += val;
      return `<td style="border:1px solid #ccc; padding:6px;">${val}</td>`;
    });
    rowTotals.push(rowTotal);
    tbody.append(`<tr><td style="border:1px solid #ccc; padding:6px;">${flow}</td>${cells.join('')}<td style="border:1px solid #ccc; padding:6px; font-weight:bold;">${rowTotal}</td></tr>`);
  });

  // Column totals
  const colTotals = partners.map((partner, i) => {
    let total = 0;
    flowTypes.forEach(flow => {
      total += tableData[flow][partner];
    });
    return total;
  });

  const totalRow = `
    <tr style="font-weight:bold; background:#f0f0f0;">
      <td style="border:1px solid #ccc; padding:6px;">Total</td>
      ${colTotals.map(t => `<td style="border:1px solid #ccc; padding:6px;">${t}</td>`).join('')}
      <td style="border:1px solid #ccc; padding:6px;">${rowTotals.reduce((a,b)=>a+b,0)}</td>
    </tr>
  `;
  tbody.append(totalRow);

  $('#dashboardModal').show();
});

$('#partnerTCsBtn').click(async function () {
  if (!filteredSheetData.length) {
    alert('No data to export');
    return;
  }

  // Group by Partner → Flow
  const partnerFlowGroups = {};
  filteredSheetData.forEach(row => {
    const partner = (row.PARTNER_NAME || 'Unknown')
      .toString()
      .replace(/[\\/:*?"<>|]/g, '_');
    const flow = (row.FLOW || 'Unknown')
      .toString()
      .replace(/[\\/:*?"<>|]/g, '_');

    if (!partnerFlowGroups[partner]) partnerFlowGroups[partner] = {};
    if (!partnerFlowGroups[partner][flow]) partnerFlowGroups[partner][flow] = [];
    partnerFlowGroups[partner][flow].push(row);
  });

  $('#chunkLinks').empty();
  $('#zipLoading').show();
  const zip = new JSZip();

  for (const partner in partnerFlowGroups) {
    const wb = XLSX.utils.book_new();

    // Separate non-dups and dups
    const nonDupFlows = {};
    const dupFlows = {};
    for (const flow in partnerFlowGroups[partner]) {
      const nonDupRows = partnerFlowGroups[partner][flow].filter(r => !r.IS_DUPLICATE);
      const dupRows = partnerFlowGroups[partner][flow].filter(r => r.IS_DUPLICATE);
      if (nonDupRows.length) nonDupFlows[flow] = nonDupRows;
      if (dupRows.length) dupFlows[flow] = dupRows;
    }

    // Assign IDs - non-dups first
    let runIdCounter = 1;
    for (const flow in nonDupFlows) {
      const rows = nonDupFlows[flow].map(row => {
        const reordered = { TEST_RUN_ID: runIdCounter++ };
        fullHeaders.forEach(h => {
          if (h === 'ENABLED') reordered[h] = 'No';
          else if (h !== 'TEST_RUN_ID') reordered[h] = row[h];
        });
        return reordered;
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), flow.substring(0, 31));
    }

    // Then dups
    for (const flow in dupFlows) {
      const rows = dupFlows[flow].map(row => {
        const reordered = { TEST_RUN_ID: runIdCounter++ };
        fullHeaders.forEach(h => {
          if (h === 'ENABLED') reordered[h] = 'No';
          else if (h !== 'TEST_RUN_ID') reordered[h] = row[h];
        });
        return reordered;
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), `${flow}_DUP`.substring(0, 31));
    }

    // Create individual file
    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const blob = new Blob([wbout], { type: 'application/octet-stream' });
    const fileName = `${partner}.xlsx`;

    // Add to ZIP
    zip.file(fileName, blob);

    // ✅ Add individual download link
    const url = URL.createObjectURL(blob);
    const link = $(`
      <div class="chunk-link">
        <i class="fa fa-download"></i>
        <a href="${url}" download="${fileName}">${fileName}</a>
        <span>(${Object.keys(partnerFlowGroups[partner]).length} flows)</span>
      </div>
    `);
    $('#chunkLinks').append(link);
  }

  // Create ZIP link
  const zipBlob = await zip.generateAsync({ type: 'blob' });
  const zipUrl = URL.createObjectURL(zipBlob);
  $('#chunkLinks').append(`
    <div style='margin-top:10px;'>
      <a class='btn' href='${zipUrl}' download='PartnerTCs.zip'>Download All as ZIP</a>
    </div>
  `);

  $('#zipLoading').hide();
});
