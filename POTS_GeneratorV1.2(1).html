function createTestDataDropdown() {
    const optionsContainer = document.getElementById('testDataOptions');
    const selectedDiv = document.querySelector('#testDataDropdown .dropdown-selected');
    const selectedText = selectedDiv.querySelector('.selected-text');
    const arrow = selectedDiv.querySelector('.dropdown-arrow');
    
    // Clear existing options
    optionsContainer.innerHTML = '';
    
    // Create checkbox options
    testDataValues.forEach(function(value) {
        const option = document.createElement('div');
        option.className = 'dropdown-option';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = 'testData_' + value.toLowerCase().replace(/\s+/g, '_');
        checkbox.name = 'testData';
        checkbox.value = value.toLowerCase().replace(/\s+/g, '_');
        
        const label = document.createElement('label');
        label.htmlFor = checkbox.id;
        label.textContent = value;
        
        // Add event listener to update selected text
        checkbox.addEventListener('change', updateSelectedText);
        
        option.appendChild(checkbox);
        option.appendChild(label);
        optionsContainer.appendChild(option);
    });
    
    // Toggle dropdown
    selectedDiv.addEventListener('click', function() {
        const isOpen = optionsContainer.classList.contains('show');
        if (isOpen) {
            optionsContainer.classList.remove('show');
            selectedDiv.classList.remove('active');
            arrow.classList.remove('rotate');
        } else {
            optionsContainer.classList.add('show');
            selectedDiv.classList.add('active');
            arrow.classList.add('rotate');
        }
    });
    
    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
        if (!document.getElementById('testDataDropdown').contains(e.target)) {
            optionsContainer.classList.remove('show');
            selectedDiv.classList.remove('active');
            arrow.classList.remove('rotate');
        }
    });
    
    // Prevent dropdown from closing when clicking on options
    optionsContainer.addEventListener('click', function(e) {
        e.stopPropagation();
    });
    
    function updateSelectedText() {
        const selectedCheckboxes = document.querySelectorAll('input[name="testData"]:checked');
        const count = selectedCheckboxes.length;
        
        if (count === 0) {
            selectedText.innerHTML = 'Select Required Data';
        } else if (count === 1) {
            const value = selectedCheckboxes[0].value;
            const displayText = testDataValues.find(item => 
                item.toLowerCase().replace(/\s+/g, '_') === value
            );
            selectedText.innerHTML = displayText;
        } else {
            selectedText.innerHTML = `${count} items selected`;
        }
    }
}

}

        // Function to populate a dropdown from an array
        function populateDropdown(selectId, valuesArray) {
            const dropdown = document.getElementById(selectId);
            // Clear existing options except the first one
            while (dropdown.options.length > 1) {
                dropdown.remove(1);
            }
            
            // Add new options from the array
            valuesArray.forEach(function(value) {
                const option = document.createElement('option');
                option.value = value.toLowerCase().replace(/\s+/g, '_');
                option.textContent = value;
                dropdown.appendChild(option);
            });
        }
        
        // Populate all dropdowns
        populateDropdown('environment', environmentValues);
        populateDropdown('owner', ownerValues);
        populateDropdown('scrum', scrumValues);
