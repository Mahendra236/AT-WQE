 <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        // Tab Switching Logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
            document.querySelector(`[onclick="switchTab('${tabId}')"]`).classList.add('active');
        }

        let processedData = {
            columnA: [],
            columnC: [],
            columnD: []
        };

        function processData() {
            // Process Column A data
            const columnAInput = document.getElementById('columnAInput').value;
            processedData.columnA = columnAInput.split('\n')
                .map(line => line.trim())
                .filter(line => line !== '');

            // Process JSON data
            const jsonInput = document.getElementById('jsonInput').value;
            if (!jsonInput.trim()) {
                alert('Please enter JSON data');
                return;
            }

            try {
                const data = JSON.parse(jsonInput);
                const baseProductWPSSet = new Set();
                const productIDSet = new Set();

                // Collect unique values
                (data.baseProductInfo || []).forEach(baseProduct => {
                    const baseProductId = baseProduct.baseProductId || '';
                    const wpsList = (baseProduct.wps || []).map(wps => {
                        const paddedWPS = wps.padStart(8, '0');
                        return `WPS - ${paddedWPS}`;
                    });

                    wpsList.forEach(wps => {
                        baseProductWPSSet.add(`${baseProductId}/${wps}`);
                    });

                    (baseProduct.product || []).forEach(product => {
                        if (product.ProductID) {
                            productIDSet.add(product.ProductID);
                        }
                    });
                });

                processedData.columnC = Array.from(baseProductWPSSet).sort();
                processedData.columnD = Array.from(productIDSet).sort();

                // Display columns
                displayColumns();
            } catch (error) {
                alert('Invalid JSON data. Please check your input.');
                console.error(error);
            }
        }

        function displayColumns() {
            document.getElementById('columnA').textContent = processedData.columnA.join('\n');
            document.getElementById('columnC').textContent = processedData.columnC.join('\n');
            document.getElementById('columnD').textContent = processedData.columnD.join('\n');
        }

        function downloadExcel() {
            const partnerName = document.getElementById('partnerName').value.trim();
            if (!partnerName) {
                alert('Please enter a partner name');
                return;
            }

            if (processedData.columnC.length === 0 && processedData.columnD.length === 0) {
                alert('No data to export');
                return;
            }

            // Calculate the maximum length of all columns
            const maxLength = Math.max(
                processedData.columnA.length,
                processedData.columnC.length,
                processedData.columnD.length
            );

            // Create array of rows with headers
            const formattedData = [
                // Headers row
                {
                    "Title": "Title",
                    "Empty": "",
                    "TLO_WPS": "TLO_WPS",
                    "SLOs": "SLO's"
                }
            ];

            // Add data rows
            for (let i = 0; i < maxLength; i++) {
                formattedData.push({
                    "Title": processedData.columnA[i] || "",
                    "Empty": "",
                    "TLO_WPS": processedData.columnC[i] || "",
                    "SLOs": processedData.columnD[i] || ""
                });
            }

            const worksheet = XLSX.utils.json_to_sheet(formattedData, { skipHeader: true });
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, 'BaseProductInfo');

            // Download file
            XLSX.writeFile(workbook, `${partnerName}_output.xlsx`);
        }
		
        // Predefined scenarios
       const scenarios = [
    'Deactivate', 'Reactivate', 'Activate', 'AddProduct', 'CancelDeviceLocation', 'ChangeMSISDN', 'ChangePlan', 
    'ChangeSIM',  'HLRBlockSIM', 'ModifySubscriberBucket', 'NGPInquiry', 
    'QueryNetwork', 'QueryProducts', 'QuerySIM', 'QuerySubscriberUsage', 
    'QueryTransactionStatus',  'RemoveProduct', 'ReplaceProduct', 
    'Resume', 'RollbackSIM', 'SendOTAMSISDN', 'SubscriberInquiry', 'Suspend', 
    'UpdateMiscSubscriberDetails', 'UpdateWPS', 'ValidateAddress'
];
const commentValues = [

];
		

        // Utility function to populate dropdowns
    function populateDropdown(dropdown, options, placeholder = '--Select--') {
    dropdown.innerHTML = `<option value="">${placeholder}</option>`;
    Array.from(options).forEach(option => {
        if (option) {
            const opt = document.createElement('option');
            opt.value = option;
            opt.textContent = option;
            dropdown.appendChild(opt);
        }
    });
}
		
		function updateSelectedRowsColumn(columnIndex, value) {
    const rows = document.querySelectorAll('#dataTable tbody tr');
    let updatedRows = 0;

    rows.forEach(row => {
        const checkbox = row.querySelector('input[type="checkbox"]');
        if (checkbox && checkbox.checked) {
            const cellDropdown = row.cells[columnIndex].querySelector('select');
            if (cellDropdown) {
                // Force update the dropdown, regardless of existing value
                cellDropdown.value = value;
                
                // Trigger change event for Select2
                $(cellDropdown).val(value).trigger('change');
                
                updatedRows++;
            }
        }
    });

    if (updatedRows === 0) {
        alert('Please select at least one row to update.');
    } else {
        console.log(`Updated ${updatedRows} row(s) in column ${columnIndex}`);
    }
}

// Apply button event listener remains the same as in the previous suggestion

    if (tloWpsDropdown.value) {

        // Populate global dropdowns

        document.getElementById('slo7Dropdown'),
        document.getElementById('slo8Dropdown')
    ];            

            const tloWpsOptions = new Set(data.slice(1).map(row => row[2]).filter(value => value));
            const sloOptions = new Set(data.slice(1).map(row => row[3]).filter(value => value));
            const commentOptions = new Set(data.slice(1).map(row => row[4]).filter(value => value));

            populateDropdown(tloWpsDropdown, tloWpsOptions);
            sloDropdowns.forEach(dropdown => {
        populateDropdown(dropdown, sloOptions);

        }

        // Upload button event listener
        document.getElementById('uploadButton').addEventListener('click', function () {
    const fileInput = document.getElementById('excelFileInput');
    const file = fileInput.files[0];
    const downloadButton = document.getElementById('downloadButton');

    if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
			
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
			
			populateDropdowns(json);
            populateTable(json);
            downloadButton.style.display = 'inline-block';
        };
        reader.readAsArrayBuffer(file);
    } else {
        alert('Please select an Excel file to upload.');
    }
});

        // Function to generate future date
        function generateFutureDate() {
    const futureDate = new Date();
    futureDate.setFullYear(futureDate.getFullYear() + 1);
    
    const month = futureDate.getMonth() + 1; // getMonth() returns 0-11
    const day = futureDate.getDate();
    const year = futureDate.getFullYear();
    
    // Format as MM/DD/YYYY
    return `${month.toString().padStart(2, '0')}/${day.toString().padStart(2, '0')}/${year}`;
}

        // Download button event listener
document.getElementById('downloadButton').addEventListener('click', function() {
    const rows = document.querySelectorAll('#dataTable tbody tr');
    const fileName = document.getElementById('fileName').value.trim();
    const tdmPartner = document.getElementById('tdmPartner').value.trim();
    const selectedRows = Array.from(rows).filter(row => row.querySelector('input[type="checkbox"]').checked);
// Reset previous highlights
    rows.forEach(row => {
        const scenarioCell = row.cells[3]; // Scenario column
        scenarioCell.style.backgroundColor = '';
    });
	
    const validationErrors = [];

   if (!fileName) validationErrors.push('Enter a File Name');
   if (!tdmPartner) validationErrors.push('Enter a TDM Partner name');
   if (selectedRows.length === 0) validationErrors.push('Select at least one row');

   // Check Scenario validation
   const incompleteScenarioRows = selectedRows.filter(row => {
       const scenarioDropdown = row.cells[3].querySelector('select');
       const isEmptyScenario = !scenarioDropdown.value;
       
       if (isEmptyScenario) {
           row.cells[3].style.backgroundColor = '#ffcccc';
       }
       
       return isEmptyScenario;
   });

   if (incompleteScenarioRows.length > 0) {
       validationErrors.push('Fill Scenario for all selected rows');
   }

   // Prevent download if any validation errors
   if (validationErrors.length > 0) {
       alert(validationErrors.join('\n'));
       return;
   }

    const exportData = [];
    exportData.push([
        'TEST_RUN_ID', 'Title', 'Scenario', 'PLAN', 'SOC', 
        'FEATURE', 'FEATURE_VALUE', 'COMMENTS', 'ENABLED'
    ]);

    let serialNumber = 1;

    function generateFutureDate() {
        const futureDate = new Date();
        futureDate.setFullYear(futureDate.getFullYear() + 1);
        const month = futureDate.getMonth() + 1;
        const day = futureDate.getDate();
        const year = futureDate.getFullYear();
        return `${month.toString().padStart(2, '0')}/${day.toString().padStart(2, '0')}/${year}`;
    }

    rows.forEach(row => {
        const checkbox = row.querySelector('input[type="checkbox"]');
        if (!checkbox.checked) return;

        const title = row.cells[2].textContent;
        const scenario = row.cells[3].querySelector('select').value;
        const plan = row.cells[4].querySelector('select').value;

            if (slo5) exportData.push([serialNumber, '', scenario, plan, `From3:${slo5}`, '', '', '', '']);
            if (slo6) exportData.push([serialNumber, '', scenario, plan, `To3:${slo6}`, '', '', '', '']);
            if (slo7) exportData.push([serialNumber, '', scenario, plan, `From4:${slo7}`, '', '', '', '']);
            if (slo8) exportData.push([serialNumber, '', scenario, plan, `To4:${slo8}`, '', '', '', '']);
            
            serialNumber++;
            return; // Skip the rest of the processing for ReplaceProduct
        }

        const sloValues = [];
         for (let i = 6; i <= 13; i++) {
             const sloCell = row.cells[i].querySelector('select');
            const sloValue = sloCell ? sloCell.value : "";
            if (sloValue) sloValues.push(sloValue);
         }
		  // If no SLOs are selected, push one row with generic data
        if (sloValues.length === 0) {
            exportData.push([
                serialNumber, 
                title,
                scenario,
                plan,
                '',
                '',
                '',
                commentValue,
                ''
            ]);
            serialNumber++;
            return;
        }

        let isFirstRow = true;
        
        if (scenario === 'QueryProducts') {
            sloValues.forEach(sloValue => {
                exportData.push([
                serialNumber, 
                    isFirstRow ? title : '',
                    scenario,
                    plan,
                    sloValue,
                    '',  // Empty feature
                    '',  // Empty feature value
                    isFirstRow ? commentValue : '',
                    ''
                ]);
                isFirstRow = false;
            });
        } else {
            // For all other scenarios, keep the existing logic
            sloValues.forEach(sloValue => {
                if (sloValue === 'E911') {
                    const e911Features = {
                        'Address': '4601 Ridgeview Rd',
                        'City': 'Atlanta',

                    Object.entries(e911Features).forEach(([feature, value]) => {

					['WFC', 'IMS', 'IPMS'].forEach(additionalSLO => {

                } else if (sloValue.startsWith('NC_')) {
                    const ncFeatures = [

						['Threshold', 'Tier4'],

                    ncFeatures.forEach(([feature, value]) => {
                        exportData.push([

                            isFirstRow ? commentValue : '',

                        ]);

                } else {

                serialNumber, 
                        isFirstRow ? title : '',
                        scenario,
                        plan,
                        sloValue,
                        '',
                        '',
                        isFirstRow ? commentValue : '',
                        ''
                    ]);
                    isFirstRow = false;
                }
            });
        }

        serialNumber++;
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(exportData);
    XLSX.utils.book_append_sheet(wb, ws, tdmPartner);

    XLSX.writeFile(wb, `${fileName}.xlsx`);
});

function findBestTloWpsMatch(title, tloWpsOptions) {
    // Clean and normalize the title
    const titleLower = title.toLowerCase()
        .replace(/[\[\]]/g, '')
        .replace(/rest api/i, '')
        .trim();

    let bestMatch = null;
    let highestMatchScore = 0;

    Array.from(tloWpsOptions).forEach(tloWps => {
        const tloWpsLower = tloWps.toLowerCase();
        
        // Split both strings into significant terms
        const tloWpsTerms = tloWpsLower
            .replace(/[\/\-_]/g, ' ')
            .split(' ')
            .filter(term => term.length > 2 && !['wps', 'the', 'and'].includes(term));

        const titleTerms = titleLower
            .replace(/[\/\-_]/g, ' ')
            .split(' ')
            .filter(term => term.length > 2 && !['wps', 'the', 'and'].includes(term));

        // Calculate match score
        let matchScore = 0;
        tloWpsTerms.forEach(term => {
            if (titleTerms.includes(term)) {
                matchScore += term.length;
            }
        });

        if (matchScore > highestMatchScore) {
            highestMatchScore = matchScore;
            bestMatch = tloWps;
        }
    });

    return highestMatchScore > 8 ? bestMatch : null;
}

function extractSLOsFromTitle(title, availableSLOs) {
    // Convert title and clean it
    title = String(title).replace(/[\[\]]/g, '');
    
    // Convert both title and SLOs to lowercase for case-insensitive matching
    const titleLower = title.toLowerCase();
    const sloMap = new Map(Array.from(availableSLOs).map(slo => [slo.toLowerCase(), slo]));
    
    // Find all matching SLOs while preserving their original case
    const matches = [];
    sloMap.forEach((originalSLO, lowerSLO) => {
        if (titleLower.includes(lowerSLO)) {
            matches.push(originalSLO);
        }
    });
    
    console.log('Available SLOs:', Array.from(availableSLOs));
    console.log('Found SLOs in title:', matches);
    return matches;
}

function populateTable(data) {
    if (!data || !data.length) {
        console.error('No data provided to populateTable');
        return;
    }

    const tableBody = document.getElementById('dataTable').querySelector('tbody');
    tableBody.innerHTML = '';

    // Extract unique options from data
    const tloWpsOptions = new Set();
    const sloOptions = new Set();
    const commentOptions = new Set();

    // Skip header row and collect unique values
    data.slice(1).forEach(row => {
        if (row[2]) tloWpsOptions.add(row[2]);
        if (row[3]) sloOptions.add(row[3]);
        if (row[4]) commentOptions.add(row[4]);
    });

    // Populate table rows
    data.slice(1).forEach((row, index) => {
        if (!row[0]) return; // Skip empty rows

        const tr = document.createElement('tr');
        const title = row[0];
        
        // Extract SLOs from title using available SLO options
        const matchingSlos = extractSLOsFromTitle(title, sloOptions);

        // Add checkbox cell
        tr.innerHTML = `
            <td><input type="checkbox"></td>
            <td>${index + 1}</td>
            <td>${title}</td>
        `;

        // Add Scenario dropdown
        const scenarioCell = document.createElement('td');
        const scenarioDropdown = document.createElement('select');
        scenarioDropdown.innerHTML = `
            <option value="">Select Scenario</option>
            ${scenarios.map(scenario => `
                <option value="${scenario}" ${
                    title.toLowerCase().includes(scenario.toLowerCase()) ? 'selected' : ''
                }>${scenario}</option>
            `).join('')}
        `;
        scenarioCell.appendChild(scenarioDropdown);
        tr.appendChild(scenarioCell);

        // Add TLO_WPS dropdown with auto-selection
        const tloWpsCell = document.createElement('td');
        const tloWpsDropdown = document.createElement('select');
        tloWpsDropdown.innerHTML = '<option value="">Select TLO_WPS</option>';
        
        const bestMatch = findBestTloWpsMatch(title, tloWpsOptions);
        
        Array.from(tloWpsOptions).forEach(tloWps => {
            const option = document.createElement('option');
            option.value = tloWps;
            option.textContent = tloWps;
            if (bestMatch && tloWps === bestMatch) {
                option.selected = true;
            }
            tloWpsDropdown.appendChild(option);
        });
        tloWpsCell.appendChild(tloWpsDropdown);
        tr.appendChild(tloWpsCell);

        // Add TLO_WPS2 dropdown
        const tloWps2Cell = document.createElement('td');
        const tloWps2Dropdown = document.createElement('select');
        populateDropdown(tloWps2Dropdown, tloWpsOptions, 'Select TLO_WPS2');
        tloWps2Cell.appendChild(tloWps2Dropdown);
        tr.appendChild(tloWps2Cell);

        // Add SLO1-SLO8 dropdowns with auto-selection
        for (let i = 0; i < 8; i++) {
            const sloCell = document.createElement('td');
            const sloDropdown = document.createElement('select');
            sloDropdown.innerHTML = `<option value="">Select SLO${i + 1}</option>`;

            Array.from(sloOptions).forEach(slo => {
                const option = document.createElement('option');
                option.value = slo;
                option.textContent = slo;
                
                // Auto-select if this SLO matches and is in the correct position
                if (matchingSlos[i] && slo === matchingSlos[i]) {
                    option.selected = true;
                    console.log(`Auto-selecting ${slo} for SLO${i + 1}`); // Debug log
                }
                
                sloDropdown.appendChild(option);
            });

            sloCell.appendChild(sloDropdown);
            tr.appendChild(sloCell);
        }

        // Add Comment dropdown
        const commentCell = document.createElement('td');
    const commentDropdown = document.createElement('select');
    populateDropdown(commentDropdown, commentValues, 'Select Comment');
        
        // Add TLO_WPS2 and Comment interaction
        tloWps2Dropdown.addEventListener('change', function() {
            commentDropdown.disabled = !!this.value;
            if (this.value) {
                commentDropdown.selectedIndex = 0;
            }
        });

        commentCell.appendChild(commentDropdown);
        tr.appendChild(commentCell);

        tableBody.appendChild(tr);
    });

    // Initialize Select2 for all dropdowns
    $(document).ready(function() {
        // Initialize table dropdowns
        $('#dataTable select').select2({
            width: '100%',
            dropdownParent: $('#dataTable'),
            placeholder: function() {
                return $(this).find('option:first').text();
            }
        });

        // Initialize global dropdowns
        $('#tloWpsDropdown, [id^=slo][id$=Dropdown]').select2({
            width: '100%',
            placeholder: function() {
                return $(this).find('option:first').text();
            }
        });
    });
}
